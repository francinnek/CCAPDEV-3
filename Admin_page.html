  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
      <!-- jQuery Script -->
    <script>
$(function(){
  // Using your existing reservation info as static data
  const bookings = [
    {
      id: 1,
      from: "Manila",
      to: "Hong Kong",
      name: "Wilson",
      flight: "CX0101",
      date: "Dec 12 2023",
      seat: "20J",
      gate: "12",
      time: "10:15am"
    },
    {
      id: 2,
      from: "Manila",
      to: "Cebu",
      name: "Wilson",
      flight: "CX608",
      date: "May 26 2024",
      seat: "60H",
      gate: "42",
      time: "13:25pm"
    },
    {
      id: 3,
      from: "Cebu",
      to: "Manila",
      name: "Wilson",
      flight: "CX725",
      date: "June 01 2024",
      seat: "69C",
      gate: "8",
      time: "13:40pm"
    }
  ];

  // Show booking list when button is clicked
  $("#flightButo").click(function(){
    let table = `
      <table class="table table-hover align-middle">
        <thead>
          <tr>
            <th>#</th>
            <th>From</th>
            <th>To</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody>
    `;
    bookings.forEach(b => {
      table += `
        <tr>
          <td>${b.id}</td>
          <td>${b.from}</td>
          <td>${b.to}</td>
          <td><button class="btn btn-primary view-details" data-id="${b.id}">View Details</button></td>
        </tr>`;
    });
    table += `</tbody></table>`;
    $("#booking-list").html(table);
    $("#booking-details").hide();
    $("#booking-list").show();

    new bootstrap.Modal(document.getElementById('flightModal')).show();
  });

  // Handle View Details click
  $(document).on("click", ".view-details", function(){
    const id = $(this).data("id");
    const b = bookings.find(x => x.id === id);

    $("#details-content").html(`
      <div class="card p-3">
        <h5>Reservation #${b.id}</h5>
        <p><strong>Passenger:</strong> ${b.name}</p>
        <p><strong>Flight Number:</strong> ${b.flight}</p>
        <p><strong>Route:</strong> ${b.from} → ${b.to}</p>
        <p><strong>Date:</strong> ${b.date}</p>
        <p><strong>Seat:</strong> ${b.seat}</p>
        <p><strong>Gate:</strong> ${b.gate}</p>
        <p><strong>Boarding Time:</strong> ${b.time}</p>
      </div>
    `);

    $("#booking-list").hide();
    $("#booking-details").show();
  });

  // Go back to list
  $("#backToList").click(function(){
    $("#booking-details").hide();
    $("#booking-list").show();
  });
});
</script>
