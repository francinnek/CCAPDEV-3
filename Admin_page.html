<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Page</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!--menu symbol (Reference from material icon search in google chrome)-->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
  
  <!-- jQuery -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <!-- Bootstrap Bundle (with JS for modal) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  
  <style>
    body{
        background-image: url('https://gamingbolt.com/wp-content/uploads/2020/08/microsoft-flight-simulator-image-3-1024x576.jpg');
        background-size: cover;
        
    }
    
    .but2{
        gap: 2000px;
    }
    
    .container{
        display: grid;
        grid-template-columns: 14rem auto;
    }
    .sidebar{
        display: flex;
        flex-direction: column;
        height: 85vh;
        position: relative;
        
    }
   
    .button-container{
        background-color: antiquewhite;
        text-align: center;
    }

    .accountButo:hover{
        color: grey;
    }

    .flightButo:hover{
        color: grey;
    }
  </style>
</head>

<body>
    <div class="container">
        <aside>
            <div class="top">
                <div class="logo">
                    <h2>Hello <span class="danger"></span></h2>
                </div>
                <div class="symbols">
                    <!--Airline symbols (Reference from material icon search in google chrome)-->
                    <span class="material-symbols-outlined">airlines</span>
                </div>
            </div>

            <aside class="sidebar">
                <div class="button-container">
                <button class="accountButo" id="accountButo">
                    <!--Account symbol (Reference from material icon search in google chrome)-->
                    <span class="material-symbols-outlined">account_circle User</span>
                </button>
        
                <button class="flightButo" id="flightButo">
                    <!--Flight symbol (Reference from material icon search in google chrome)-->
                <span class="material-symbols-outlined">flight view</span>
                </button>
                </div>
            </aside>
        </aside>

        <main>
            <h1></h1>
        </main>
<!--User info (dummy data)-->
  <div class="modal fade" id="userModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">User Information</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" id="m1-modal-body">
          <!-- personal info will be filled in with jQuery -->
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        </div>
      </div>
    </div>
  </div>

<!--Flight info (dummy data)-->
  <div class="modal fade" id="flightModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">User Information</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" id="m2-modal-body">
          <!-- personal info will be filled in with jQuery -->
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        </div>
      </div>
    </div>
  </div>

    
    <!-- jQuery Script -->
    <script>
    $(function(){
        $("#accountButo").click(function(){
            var userInfo = `
            <p>Name: Wilson</p>
            <p>Email: wilson@gmail.com</p>
            <p>Age: 20</p>
            <p>Location: Manila, PH</p>
            <p>Summary: Active Admin User</p>`;

            $('#m1-modal-body').html(userInfo);
            
            let userModal = new bootstrap.Modal(document.getElementById('userModal'));
            userModal.show();
        });

        $("#flightButo").click(function(){
            var flightInfo = `
            <p>Flight number: CX0101</p>
            <p> MNL -> HKG </p>
            <p>Name:Wilson</p>
            <p>Date Dec 12 2023</p>
            <p>Seat: 20J</p>
            <p>Gate: 12</p>
            <p>Boaeding Time:10:15am</p>`;

            $('#m2-modal-body').html(flightInfo);

            let flightModal = new bootstrap.Modal(document.getElementById('flightModal'));
            flightModal.show();
        });
    }); 
    </script>
</body>
</html>
