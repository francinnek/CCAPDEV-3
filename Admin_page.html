<!DOCTYPE html>  
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!--JQuery-->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

  <title>Admin Offcanvas Demo</title>  
  <!--   Bootstrap CSS link - essential for styling all classes -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>

 <nav class="navbar navbar-expand-lg bg-body-tertiary">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">ᯓ ✈︎ </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0"> 

      <li class="nav-item">
    <button class="btn btn-secondary me-md-4" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasExample" aria-controls="offcanvasExample">
      User Management
    </button>
      </li>

        <li class="nav-item">
      <button type="button" class="btn btn-info" id="flightButo">
      Flight (My Bookings)
      </button>

      
        </li>
</div>
<!-- Flight Modal -->
<div class="modal fade" id="flightModal" tabindex="-1" aria-labelledby="flightModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h1 class="modal-title fs-5" id="flightModalLabel">Flight</h1>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
        <div class="modal-body" id="modal-body">
          <!-- personal info will be filled in with jQuery -->
        </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        <button type="button" id="confirm" class="btn btn-primary">Confirm Selection</button>
      </div>
    </div>
  </div>
</div>
</li>


    <form class="d-flex" role="search">
      <input class="form-control me-2 " type="search" placeholder="Search" aria-label="Search"/>
      <button class="btn btn-outline-success me-md-4" type="submit">Search</button>
    </form>

    <div class="d-grid gap-2 d-md-flex justify-content-md-end">
  <button class="btn btn-primary me-md-2" type="button">Log in</button>
   </div>
   
    </div>
  </div>
</nav>

  
  <div class="offcanvas offcanvas-start" tabindex="-1" id="offcanvasExample" aria-labelledby="offcanvasExampleLabel">
    <div class="offcanvas-header">
      <h5 class="offcanvas-title" id="offcanvasExampleLabel">Profile</h5>
      <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
    </div>
    <div class="offcanvas-body">
      <div>
        <p>Profile</p>
        <p>Name:Wilson</p>
        <p>Birthdate: 02-28-2000</p>
        <p>Member (Y/N):Yes</p>
        <p>Some text as placeholder.  you can have the elements you have chosen. Like, text, images, lists, etc.</p>
        
      </div>
      <div class="dropdown mt-3">
        <button class="btn btn-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown">
          Settings
        </button>
        <ul class="dropdown-menu">
          
          <li><a class="dropdown-item" href="#">Log out</a></li>
          <li><a class="dropdown-item" href="#">change password</a></li>
          <li><a class="dropdown-item" href="#">edit profile</a></li>
        </ul>
      </div>
    </div>
  </div>
     <img src="https://www.flightnetwork.com/system/image/open_graph_default_image.jpg" class="img-fluid" alt="background-image" max-width="100%" height="auto">

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
      <!-- jQuery Script -->
    <script>
    $(function(){
        $("#flightButo").click(function(){

        var flightTable = `
          <table class="table">
          <thead>
          <tr>
           <th scope="col">#</th>
           <th scope="col">From</th>
           <th scope="col">To</th>
           <th scope="col">Details</th>
          </tr>
          </thead>
          
  <tbody>
    <tr>
      <th scope="row">1</th>
      <td>Manila</td>
      <td>HongKong</td>
      <td>
        <p class="d-inline-flex gap-1">
        <button class="btn btn-primary" type="button" data-bs-toggle="collapse" data-bs-target="#multiCollapseExample1" aria-expanded="false" aria-controls="multiCollapseExample1">See details</button>
        </button>
          </p>
           <div class="collapse" id="multiCollapseExample1">
            <div class="card card-body">
            <h2>Reservation #1</h2>
            <p>Flight number: CX0101 <br>
            MNL -> HKG <br>
            Name:Wilson <br>
            Date Dec 12 2023 <br>
            Seat: 20J <br>
            Gate: 12 <br>
            Boarding Time:10:15am</p>
          </div>
         </div>
        </td>

    </tr>
    <tr>
      <th scope="row">2</th>
      <td>Manila</td>
      <td>Cebu</td>
      <td>
          <p class="d-inline-flex gap-1">
        <button class="btn btn-primary" type="button" data-bs-toggle="collapse" data-bs-target="#multiCollapseExample2" aria-expanded="false" aria-controls="multiCollapseExample2">See details</button>
        </button>
          </p>
           <div class="collapse" id="multiCollapseExample2">
            <div class="card card-body">
            <h2>Reservation #2</h2>
            <p>Flight number: CX608 <br>
             Manila -> Cebu <br>
            Name:Wilson <br>
            Date May 26 2024 <br>
            Seat: 60H <br>
            Gate: 42 <br>
            Boarding Time:13:25pm</p>
          </div>
         </div>
        </td>
    </tr>
    <tr>
      <th scope="row">3</th>
      <td>Cebu</td>
      <td>Manila</td>
      <td>
                  <p class="d-inline-flex gap-1">
        <button class="btn btn-primary" type="button" data-bs-toggle="collapse" data-bs-target="#multiCollapseExample3" aria-expanded="false" aria-controls="multiCollapseExample3">See details</button>
        </button>
          </p>
           <div class="collapse" id="multiCollapseExample3">
            <div class="card card-body">
            <h2>Reservation #3</h2>
            <p>Flight number: CX725 <br>
             Cebu -> Manila <br>
            Name:Wilson <br>
            Date June 01 2024 <br>
            Seat: 69C <br>
            Gate: 8 <br>
            Boarding Time:13:40pm</p>
        </td>
        </tr>
       </tbody>
      </table>
           `; 

          $('#modal-body').html(flightTable);

          flightModal = new bootstrap.Modal(document.getElementById('flightModal'));
          flightModal.show();
            
    });

    }); 
    </script>
</body>
</html>
