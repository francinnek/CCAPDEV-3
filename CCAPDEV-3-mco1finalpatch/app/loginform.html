<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
  
  <!-- jQuery -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <!-- Bootstrap Bundle (with JS for modal) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  
  <style>
    :root {
      --primary-color: #4CAF50; 
      --secondary-color: #2E7D32; 
      --light-bg: #f8f9fa;
      --text-color: black; 
      --light-grey: #666; 
    }

    body {
      background-color: var(--light-bg);
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background-color: var(--primary-color); 
      color: white;
      padding: 1rem 2rem;
    }

    .header-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 1200px;
      margin: 0 auto;
    }

    .brand {
      display: flex;
      align-items: center;
    }

    .brand h1 {
      margin: 0;
      font-size: 1.8rem;
      margin-left: 10px;
    }

    .header-logo {
      height: 40px;
      width: auto;
    }
    
    nav {
      display: flex;
      align-items: center;
    }

    nav a {
      color: white;
      margin: 0 10px;
      text-decoration: none;
    }

    nav a:hover {
      text-decoration: underline;
    }

    nav a.active {
      font-weight: bold;
      border-bottom: 2px solid white;
      padding-bottom: 5px;
    }
    
    nav button.navbar-nav-link {
      color: white;
      background: transparent;
      border: none;
      margin: 0 10px;
      padding: 0;
      font-family: inherit;
      font-size: inherit;
      cursor: pointer;
      text-decoration: none;
    }
    
    nav button.navbar-nav-link:hover {
      text-decoration: underline;
    }

    footer {
      background-color: var(--primary-color); 
      color: white;
      text-align: center;
      padding: 0.8rem;
      position: fixed;
      bottom: 0;
      width: 100%;
      box-shadow: 0 -2px 5px rgba(0, 0, 0, 0.1);
    }

    .logo-container {
      text-align: center;
      margin: 40px auto;
      padding: 1px;
      width: 100%;
      max-width: 650px; 
    }

    .logo-image {
      max-width: 200px; 
      height: auto;
      display: block;
      margin: 0 auto;
    }

    form {
      background-color: white;
      padding: 2rem;
      border-radius: 12px;
      border: 2px solid var(--primary-color);
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15); 
      width: 100%;
      max-width: 650px;
      margin: 0 auto 20px auto;
    }
    
    .btn-login {
      background-color: var(--primary-color); 
      border-color: var(--primary-color);
      color: white;
      font-weight: 600;
      padding: 10px 20px;
      width: 48%;
    }
    
    .btn-login:hover {
      background-color: var(--secondary-color);
      border-color: var(--secondary-color);
    }
    
    .btn-register {
      background-color: white; 
      border-color: var(--primary-color);
      color: var(--primary-color);
      font-weight: 600;
      padding: 10px 20px;
      width: 48%;
    }
    
    .btn-register:hover {
      background-color: #f8f9fa;
      border-color: var(--secondary-color);
      color: var(--secondary-color);
    }
    
    .button-container {
      display: flex;
      justify-content: space-between;
    }
    
    .back-button {
      display: block;
      margin-top: 15px;
      text-align: center;
    }
  
    .loginregbuttons {
      margin-top: 60px !important;
      margin-bottom: 0px;
    }
  </style>
</head>

<body>
  <header>
    <div class="header-container">
      <div class="brand">
        <h1>DLSU Airlines</h1>
      </div>
    </div>
  </header>
  <div class="logo-container">
    <img src="DLSU-Airlines.png" class="logo-image" alt="DLSU Airlines Logo">
  </div>
  <div class="container d-flex flex-column align-items-center mt-5 mb-5 pb-5">
    <form id="loginForm" novalidate>
      <h2 class="mb-4 text-center">Log in</h2>
      <!-- Account Details -->
      <div class="mb-3">
        <label for="username" class="form-label">Username *</label>
        <input type="text" class="form-control" id="username" name="username" required>
      </div>

      <div class="mb-5">
        <label for="password" class="form-label">Password *</label>
        <input type="password" class="form-control" id="password" name="password" required>
      </div>
      
      <div class="button-container loginregbuttons">
        <button type="button" id="loginBtn" class="btn btn-login">Log in</button>
        <button type="button" id="registerBtn" class="btn btn-register">Register</button>
      </div>
      
      <!-- Uncomment if you want to add back button -->
      <!-- <div class="back-button">
        <a href="Admin_page.html" class="btn btn-secondary">Back to admin</a>
      </div> -->
    </form>
    
    <div id="formMessage" class="mt-4"></div>
  </div>
  
  <footer>
    <p>&copy; MCO1 Online Airline Ticketing System | GROUP 3</p>
  </footer>
  
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      document.getElementById('loginBtn').addEventListener('click', function() {
        window.location.href = 'Admin_page.html';
      });
      
      document.getElementById('registerBtn').addEventListener('click', function() {
        window.location.href = 'Admin_page.html';
      });
      
      document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault();
        window.location.href = 'Admin_page.html';
      });
    });
  </script>
</body>
</html>
