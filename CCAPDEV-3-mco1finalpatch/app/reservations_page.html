<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Reservations - DLSU Airlines</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        :root {
            --primary-color: #4CAF50;
            --secondary-color: #2E7D32;
            --light-bg: #f8f9fa;
            --text-color: black;
            --light-grey: #666;
        }

        body {
            background-color: var(--light-bg);
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            color: var(--text-color);
        }

        header {
            background-color: var(--primary-color);
            color: white;
            padding: 2rem 0;
            text-align: center;
        }

        nav a {
            color: white;
            margin: 0 10px;
            text-decoration: none;
        }

        nav a:hover {
            text-decoration: underline;
        }

        nav a.active {
            font-weight: bold;
            border-bottom: 2px solid white;
            padding-bottom: 5px;
        }

        main {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            padding-bottom: 70px;
            flex-direction: column;
        }

        .reservations-container {
            background-color: white;
            padding: 2rem;
            border-radius: 12px;
            border: 2px solid var(--primary-color);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
            width: 100%;
            max-width: 800px; 
        }

        h1 {
            color: white;
            font-weight: bold;
        }

        h2 {
            color: var(--secondary-color);
            font-weight: bold;
            margin-bottom: 1.5rem;
        }

        
        .table {
            --bs-table-hover-bg: rgba(76, 175, 80, 0.1); 
        }

        .btn-primary {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
            font-weight: bold;
            padding: 5px 10px;
            transition: background-color 0.3s;
        }

        .btn-primary:hover {
            background-color: var(--secondary-color);
            border-color: var(--secondary-color);
        }

        .btn-secondary {
            background-color: var(--light-grey);
            border-color: var(--light-grey);
            color: white;
        }

        .btn-secondary:hover {
            background-color: #444;
            border-color: #444;
        }

        .card {
            border: 1px solid var(--primary-color);
        }

        footer {
            background-color: var(--primary-color);
            color: white;
            text-align: center;
            padding: 0.8rem;
            position: fixed;
            bottom: 0;
            width: 100%;
            box-shadow: 0 -2px 5px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>

    <header>
        <nav>
            <h1>DLSU Airlines</h1>
            <a href="Admin_page.html">Admin Home</a>
            <a href="#" class="active">My Reservations</a>
            <a href="search_page.html">Search Flight</a>
        </nav>
    </header>

    <main>
        <div class="reservations-container">
            <h2 id="page-title">Booked Reservations</h2>

            <div id="booking-list">
                <p class="text-center text-muted">Loading reservations...</p>
            </div>

            <div id="booking-details" class="mt-4" style="display:none;">
                <h4 class="mb-3">Reservation Details</h4>
                <div id="details-content">
                    </div>
                <button class="btn btn-secondary mt-3" id="backToList">← Back to List</button>
            </div>
        </div>
    </main>

    <footer>
        &copy; MCO1 Online Airline Ticketing System | GROUP 3
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

    <script>
        $(function(){
            const bookings = [
                {
                    id: 1,
                    from: "Manila",
                    to: "Hong Kong",
                    name: "Wilson",
                    flight: "CX0101",
                    date: "Dec 12 2023",
                    seat: "20J",
                    gate: "12",
                    time: "10:15am"
                },
                {
                    id: 2,
                    from: "Manila",
                    to: "Cebu",
                    name: "Wilson",
                    flight: "CX608",
                    date: "May 26 2024",
                    seat: "60H",
                    gate: "42",
                    time: "13:25pm"
                },
                {
                    id: 3,
                    from: "Cebu",
                    to: "Manila",
                    name: "Wilson",
                    flight: "CX725",
                    date: "June 01 2024",
                    seat: "69C",
                    gate: "8",
                    time: "13:40pm"
                }
            ];

            
            function displayBookingList() {
                let table = `
                    <table class="table table-hover align-middle">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>From</th>
                                <th>To</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody>
                `;
                bookings.forEach(b => {
                    table += `
                        <tr>
                            <td>${b.id}</td>
                            <td>${b.from}</td>
                            <td>${b.to}</td>
                            <td><button class="btn btn-primary view-details" data-id="${b.id}">View Details</button></td>
                        </tr>`;
                });
                table += `</tbody></table>`;
                $("#booking-list").html(table).show();
                $("#booking-details").hide();
                $("#page-title").text("Booked Reservations");
            }

            
            displayBookingList();

            
            $(document).on("click", ".view-details", function(){
                const id = parseInt($(this).data("id")); 
                const b = bookings.find(x => x.id === id);

                if (b) {
                    $("#details-content").html(`
                        <div class="card p-3">
                            <h5 class="card-title text-success">Reservation #${b.id}</h5>
                            <p class="card-text"><strong>Passenger:</strong> ${b.name}</p>
                            <p class="card-text"><strong>Flight Number:</strong> ${b.flight}</p>
                            <p class="card-text"><strong>Route:</strong> ${b.from} → ${b.to}</p>
                            <p class="card-text"><strong>Date:</strong> ${b.date}</p>
                            <p class="card-text"><strong>Seat:</strong> ${b.seat}</p>
                            <p class="card-text"><strong>Gate:</strong> ${b.gate}</p>
                            <p class="card-text"><strong>Boarding Time:</strong> ${b.time}</p>
                        </div>
                    `);

                    $("#booking-list").hide();
                    $("#booking-details").show();
                    $("#page-title").text(`Reservation Details #${b.id}`);
                }
            });

            
            $("#backToList").click(function(){
                displayBookingList();
            });
        });
    </script>

</body>
</html>
