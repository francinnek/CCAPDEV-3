<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="author" content="Khloe Cassandra Osena">
  <meta name="description" content="Online Airline Ticketing Flight Search Page">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flight Search | Online Airline Ticketing System</title>

  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <!-- jQuery -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>



  
  <!-- styling -->
  <style>
    :root {
      --primary-color: #0f2950;
      --light-bg: #f8f9fa;
      --text-color: #0f2950;
    }

    body {
      background-color: var(--light-bg);
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
    }

    header {
      background-color: var(--primary-color);
      color: white;
      padding: 2rem 0;
      text-align: center;
    }

    nav a {
      color: white;
      margin: 0 10px;
      text-decoration: none;
    }

    nav a:hover {
      text-decoration: underline;
    }

    main {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2rem;
    }

    form {
      background-color: white;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 650px;
    }

    label {
      font-weight: 500;
    }

    input, select {
      margin-bottom: 1rem;
    }

    #result {
      font-weight: bold;
      color: var(--primary-color);
      margin-top: 1rem;
      text-align: center;
    }

    footer {
      background-color: var(--primary-color);
      color: white;
      text-align: center;
      padding: 0.8rem;
      position: fixed;
      bottom: 0;
      width: 100%;
    }
  </style>
</head>



  
<body>
  <header>
    <h1>✈︎ Online Airline Ticketing System</h1>
    <nav>
    <!-- edit to actual file names -->
      <a href="search_page.html" class="active">Search Flights</a>
      <a href="reservation.html">Book Flight</a>
      <a href="bookings.html">My Reservations</a>
      <a href="Admin_page.html">Profile</a>
    </nav>
  </header>

  <main>
    <section id="flight-search-section">
      <form id="flightForm">
        <h3 class="text-center mb-4">Flights</h3>
        
        <!-- bootstrap grid system -->
        <div class="row">
          <div class="col-md-6">
            <label for="origin" class="form-label">Origin</label>
            <input type="text" id="origin" name="origin" class="form-control" placeholder="Enter city" required>
          </div>
          <div class="col-md-6">
            <label for="destination" class="form-label">Destination</label>
            <input type="text" id="destination" name="destination" class="form-control" placeholder="Enter city" required>
          </div>
        </div>

        <div class="row">
          <div class="col-md-6">
            <label for="departure" class="form-label">Departure Date</label>
            <input type="date" id="departure" name="departure" class="form-control" required>
          </div>
          <div class="col-md-6">
            <label for="return" class="form-label">Return Date</label>
            <input type="date" id="return" name="return" class="form-control">
          </div>
        </div>

        <div class="row">
          <div class="col-md-12">
            <label for="passengers" class="form-label">Passenger Count</label>
            <input type="number" id="passengers" name="passengers" class="form-control" min="1" value="1" required>
          </div>
        </div>

        <div class="text-center">
          <input type="submit" value="Search Flights" class="btn btn-primary mt-3">
        </div>

        <div id="result"></div>
      </form>
    </section>
  </main>



  
  <footer>
    <p>&copy; MCO1 Online Airline Ticketing System | GROUP 3</p>
  </footer>

  <script>
    // form validation with jquery
    $(document).ready(function(){
      $("#flightForm").on("submit", function(event){
        event.preventDefault();

        // gets form values
        const origin = $("#origin").val();
        const destination = $("#destination").val();
        const departure = $("#departure").val();
        const passengers = $("#passengers").val();

        // input validation
        if(origin === "" || destination === "" || departure === ""){
          $("#result").text("⚠️ Please fill in all required fields.");
        } else {
          $("#result").text("Searching flights from " + origin + " to " + destination + " for " + passengers + " passenger(s)...");
        }
      });
    });
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
