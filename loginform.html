<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Page</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!--menu symbol (Reference from material icon search in google chrome)-->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
  
  <!-- jQuery -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <!-- Bootstrap Bundle (with JS for modal) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  
  
</head>

<body>
  <div class="container mt-5 mb-5">
    <h1 class="mb-4 text-center">Log in</h1>
    <form id="registrationForm" novalidate>


      <!-- Account Details -->
      <fieldset class="form-section">
        <legend class="h5">Account Details</legend>

        <div class="mb-3">
          <label for="username" class="form-label">Username *</label>
          <input type="text" class="form-control" id="username" name="username" required>
        </div>

        <div class="mb-3">
          <label for="password" class="form-label">Password *</label>
          <input type="password" class="form-control" id="password" name="password" required>
        </div>


      </fieldset>
</form>
      
      </fieldset>



      
      <div class="d-grid gap-2">
      <button type="submit" class="btn btn-primary">Log in</button>
      
      <button class="btn btn-primary " type="button">Register</button>
      
      <a href="admin.html" class="btn btn-secondary position-absolute bottom-0 start-1 " type="button">Back to admin</a>
      </div>
    </form>

    <div id="formMessage" class="mt-4"></div>
  </div>
</body>
</html>
